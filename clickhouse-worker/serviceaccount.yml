# Kafka is MSK with IAM authentication (OAUTHBEARER). The pod gets AWS
# credentials through EKS Pod Identity: an association between this service
# account and an IAM role is created outside Kubernetes (see
# walkthrough/install.md). Nothing here changes when the role ARN changes.
#
# If the cluster uses IRSA instead of Pod Identity, uncomment the annotation.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clickhouse-worker
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::<account-id>:role/beta-if-market-clickhouse-worker
