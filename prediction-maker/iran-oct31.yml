# Translated from compose service `prediction-maker-iran-oct31`
# (container ifmarket-pred-maker-iran-oct31) in
# docker-compose.beta-bots.yml. Shared knobs come from the
# prediction-maker-common ConfigMap; credentials from Secret prediction-maker-iran-oct31.
#
# prediction-inventory-<user>-<market>.json records an unresolved mint and
# must survive pod restarts; never delete this claim while the market is open.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prediction-maker-iran-oct31-runtime
  labels:
    app.kubernetes.io/name: prediction-maker
    app.kubernetes.io/instance: iran-oct31
    app.kubernetes.io/part-of: if-market
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prediction-maker-iran-oct31
  labels:
    app.kubernetes.io/name: prediction-maker
    app.kubernetes.io/instance: iran-oct31
    app.kubernetes.io/part-of: if-market
spec:
  replicas: 0
  # Exactly one quoting process per market and wallet; never overlap old/new.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prediction-maker
      app.kubernetes.io/instance: iran-oct31
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prediction-maker
        app.kubernetes.io/instance: iran-oct31
        app.kubernetes.io/part-of: if-market
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      imagePullSecrets:
        - name: dockerhub-pull
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prediction-maker
          image: docker.io/labseterna/if-market-beta-prediction-maker
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: prediction-maker-common
            - secretRef:
                name: prediction-maker-iran-oct31
          env:
            - name: POLYMARKET_ALLOW_CONTRACT_MISMATCH
              value: "true"
            - name: POLYMARKET_ALIGNMENT_BAND
              value: "0.010000"
            - name: POLYMARKET_IF_MARKET_ID
              value: "4"
            - name: POLYMARKET_IF_YES_OUTCOME_ID
              value: "13"
            - name: POLYMARKET_IF_NO_OUTCOME_ID
              value: "14"
            - name: POLYMARKET_MARKET_SLUG
              value: "us-announces-end-of-iranian-blockade-by-october-31-2026-20260727171711632-895-372-622-413-171-454-592-696"
            - name: POLYMARKET_MARKET_URL
              value: "https://polymarket.com/event/us-announces-end-of-iranian-blockade-byptptpt-20260713152715080/us-announces-end-of-iranian-blockade-by-october-31-2026-20260727171711632-895-372-622-413-171-454-592-696"
            - name: POLYMARKET_CONDITION_ID
              value: "0xcee04ba47d02f6c64642369b34193c355f64de1b9ae425c71ea4efef1989d271"
            - name: POLYMARKET_YES_TOKEN_ID
              value: "87712920673252297509200151045391015262449055764880659907762503287643101055970"
            - name: POLYMARKET_NO_TOKEN_ID
              value: "77737603049704371401985143030203551130624520784925815473217168646825527075459"
            - name: POLYMARKET_YES_OUTCOME_LABEL
              value: "Yes"
            - name: POLYMARKET_NO_OUTCOME_LABEL
              value: "No"
            - name: PREDICTION_MAKER_LEVELS
              value: "20"
            - name: PREDICTION_MAKER_ORDER_SIZE
              value: "250"
            - name: PREDICTION_MAKER_MINT_QTY
              value: "50000000"
            - name: PREDICTION_MAKER_LEVEL_SIZE_STEP_BPS
              value: "250"
            - name: PREDICTION_MAKER_LEVEL_SIZE_CURVE_BPS
              value: "4"
            - name: PREDICTION_MAKER_LEVEL_SIZE_JITTER_BPS
              value: "50"
            - name: PREDICTION_MAKER_MARKET_ID
              value: "4"
            - name: PREDICTION_MAKER_MIN_ORDER_NOTIONAL
              value: "100000"
            - name: PREDICTION_MAKER_MAX_ORDER_NOTIONAL
              value: "120000"
            - name: PREDICTION_MAKER_MAX_INVENTORY_QTY
              value: "50000000"
            - name: POLYMARKET_REFERENCE_MODE
              value: "live"
          ports:
            - name: metrics
              containerPort: 9464
          startupProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: runtime
              mountPath: /app/.runtime/prediction-makers
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: runtime
          persistentVolumeClaim:
            claimName: prediction-maker-iran-oct31-runtime
        - name: tmp
          emptyDir: {}
